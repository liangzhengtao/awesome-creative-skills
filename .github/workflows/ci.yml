name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Skill Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check all skill files exist
        run: |
          echo "Checking skill files..."
          required_files=(
            "skills/海报设计/retro-movie-poster.md"
            "skills/海报设计/travel-poster.md"
            "skills/海报设计/music-album-cover.md"
            "skills/摄影后期/film-emulation.md"
            "skills/摄影后期/cinematic-grade.md"
            "skills/摄影后期/light-painting.md"
            "skills/品牌设计/logo-generation.md"
            "skills/品牌设计/brand-identity.md"
            "skills/社交媒体/content-creator-pack.md"
            "skills/插画创作/character-design.md"
          )
          missing=0
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing: $file"
              missing=$((missing + 1))
            else
              echo "✅ Found: $file"
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "❌ $missing required skill file(s) missing!"
            exit 1
          fi
          echo "✅ All required skill files present."

      - name: Check minimum line count
        run: |
          echo "Checking minimum line count (150 lines)..."
          failed=0
          for file in skills/**/*.md; do
            lines=$(wc -l < "$file")
            if [ "$lines" -lt 150 ]; then
              echo "❌ $file has $lines lines (minimum: 150)"
              failed=$((failed + 1))
            else
              echo "✅ $file has $lines lines"
            fi
          done
          if [ $failed -gt 0 ]; then
            echo "❌ $failed file(s) below minimum line count!"
            exit 1
          fi
          echo "✅ All skill files meet minimum line count."

      - name: Check required sections
        run: |
          echo "Checking required sections in skill files..."
          required_sections=(
            "When to Use"
            "Design Philosophy"
            "Decision Priority"
            "Instructions for AI Assistant"
            "Prompt Templates"
            "Style Reference"
            "Common Patterns"
            "Pitfalls to Avoid"
          )
          failed=0
          for file in skills/**/*.md; do
            for section in "${required_sections[@]}"; do
              if ! grep -q "## $section" "$file"; then
                echo "❌ $file missing section: $section"
                failed=$((failed + 1))
              fi
            done
          done
          if [ $failed -gt 0 ]; then
            echo "❌ $failed missing section(s) found!"
            exit 1
          fi
          echo "✅ All required sections present in all files."

      - name: Check README badges
        run: |
          echo "Checking README.md for required elements..."
          required_elements=(
            "Awesome"
            "PRs Welcome"
            "MIT"
            "10"
          )
          for element in "${required_elements[@]}"; do
            if grep -q "$element" README.md; then
              echo "✅ README contains: $element"
            else
              echo "❌ README missing: $element"
              exit 1
            fi
          done
          echo "✅ README validation passed."

      - name: Check community files
        run: |
          echo "Checking community files..."
          community_files=(
            "README.md"
            "LICENSE"
            "CONTRIBUTING.md"
            "CODE_OF_CONDUCT.md"
            "SECURITY.md"
            "CHANGELOG.md"
            ".gitignore"
            ".github/workflows/ci.yml"
            ".github/ISSUE_TEMPLATE/request_skill.md"
            ".github/pull_request_template.md"
          )
          missing=0
          for file in "${community_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing: $file"
              missing=$((missing + 1))
            else
              echo "✅ Found: $file"
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "❌ $missing community file(s) missing!"
            exit 1
          fi
          echo "✅ All community files present."

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
          config: |
            {
              "MD013": false,
              "MD033": false,
              "MD041": false,
              "MD024": false,
              "MD034": false
            }
